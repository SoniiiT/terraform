name: Twingate Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'twingate/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'twingate/**'

env:
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-no-color -input=false"
  TF_CLI_ARGS_apply: "-no-color -input=false -auto-approve"

jobs:
  validate:
    name: Validate Twingate Terraform
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.6.2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate
        working-directory: twingate
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_tg_api_token: ${{ secrets.TG_API_TOKEN }}
        run: |
          terraform init
          terraform validate

  plan:
    name: Plan Twingate Terraform
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.6.2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Plan
        working-directory: twingate
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_tg_api_token: ${{ secrets.TG_API_TOKEN }}
        run: |
          terraform init
          terraform providers lock
          terraform plan -out=tfplan
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-twingate
          path: twingate/tfplan
          retention-days: 1

  apply:
    name: Apply Twingate Terraform
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.6.2
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-twingate
          path: twingate
      
      - name: Apply
        working-directory: twingate
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_tg_api_token: ${{ secrets.TG_API_TOKEN }}
        run: |
          terraform init
          terraform apply -auto-approve tfplan 