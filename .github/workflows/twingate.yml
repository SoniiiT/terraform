name: Twingate Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'twingate/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'twingate/**'

env:
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-no-color -input=false"
  TF_CLI_ARGS_apply: "-no-color -input=false -auto-approve"

jobs:
  validate:
    name: Validate Twingate Terraform
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/opentofu/opentofu:1.6.2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate
        working-directory: twingate
        env:
          TF_VAR_twingate_api_token: ${{ secrets.TG_API_TOKEN }}
        run: |
          tofu init
          tofu validate

  plan:
    name: Plan Twingate Terraform
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/opentofu/opentofu:1.6.2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Plan
        working-directory: twingate
        env:
          TF_VAR_twingate_api_token: ${{ secrets.TG_API_TOKEN }}
        run: |
          tofu init
          tofu providers lock
          tofu plan -out=tfplan
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-twingate
          path: twingate/tfplan
          retention-days: 1

  apply:
    name: Apply Twingate Terraform
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/opentofu/opentofu:1.6.2
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-twingate
          path: twingate
      
      - name: Apply
        working-directory: twingate
        env:
          TF_VAR_twingate_api_token: ${{ secrets.TG_API_TOKEN }}
        run: |
          tofu init
          tofu apply -auto-approve tfplan
          
      - name: Configure Git
        run: |
          git config --global --add safe.directory /__w/terraform/terraform
          git config --global user.email "terraform-runner@soniiit.net"
          git config --global user.name "terraform-runner"
          
      - name: Commit and push state
        run: |
          git add twingate/terraform.tfstate
          git commit -m "[skip ci] Update Twingate terraform state"
          git push origin HEAD:${{ github.ref }} 