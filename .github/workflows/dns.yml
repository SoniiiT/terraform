name: DNS Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'dns/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'dns/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund für manuelle Ausführung'
        required: false
        default: 'Manuelle Ausführung'

env:
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-no-color -input=false"
  TF_CLI_ARGS_apply: "-no-color -input=false -auto-approve"

jobs:
  validate:
    name: Validate DNS Terraform
    runs-on: self-hosted
    container:
      image: ghcr.io/opentofu/opentofu:1.6.2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate
        working-directory: dns
        env:
          TF_VAR_tsig_key: ${{ secrets.DNS_TSIG_KEY }}
        run: |
          # Leere State-Datei löschen, um mit frischem State zu starten
          rm -f terraform.tfstate
          tofu init
          tofu validate

  plan:
    name: Plan DNS Terraform
    needs: validate
    runs-on: self-hosted
    container:
      image: ghcr.io/opentofu/opentofu:1.6.2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Plan
        working-directory: dns
        env:
          TF_VAR_tsig_key: ${{ secrets.DNS_TSIG_KEY }}
        run: |
          # Leere State-Datei löschen, um mit frischem State zu starten
          rm -f terraform.tfstate
          tofu init
          tofu providers lock
          tofu plan -out=tfplan
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dns
          path: dns/tfplan
          retention-days: 1

  apply:
    name: Apply DNS Terraform
    needs: plan
    runs-on: self-hosted
    container:
      image: ghcr.io/opentofu/opentofu:1.6.2
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dns
          path: dns
      
      - name: Apply & Debug State
        working-directory: dns
        env:
          TF_VAR_tsig_key: ${{ secrets.DNS_TSIG_KEY }}
        run: |
          # Leere State-Datei löschen, um mit frischem State zu starten
          rm -f terraform.tfstate
          
          # Initialisieren und Apply ausführen
          echo "Initialisiere und wende Konfiguration an..."
          tofu init
          tofu apply -auto-approve tfplan
          
          # State Listen um zu prüfen, dass alles korrekt angelegt wurde
          echo "Ressourcen im State:"
          tofu state list
          
          # Verzeichnis-Struktur untersuchen
          echo "==== Verzeichnisstruktur ===="
          ls -la ./
          echo "Absoluter Pfad:"
          pwd
          
          echo "==== .terraform Verzeichnis ===="
          ls -la .terraform/
          
          # Feststellen, wo der State-File liegt
          echo "==== Wo ist die State-Datei? ===="
          find / -name "*.tfstate" 2>/dev/null || echo "Keine .tfstate Dateien gefunden"
          
          # Versuche den State zu exportieren
          echo "==== State Pull Versuch ===="
          tofu state pull > terraform.tfstate.pull
          ls -la terraform.tfstate.pull
          echo "Inhalt der terraform.tfstate.pull (erste 20 Zeilen):"
          cat terraform.tfstate.pull | head -n 20
          
          # Jetzt erstellen wir einen neuen State mit den richtigen Daten
          echo "==== Manuelles State-Erstellen ===="
          # Erstellen wir den State manuell als JSON-Objekt mit Ressourcen
          echo '{
            "version": 4,
            "terraform_version": "1.6.2",
            "serial": 1,
            "lineage": "terraform-manual",
            "outputs": {},
            "resources": [' > terraform.tfstate.manual
            
          # Füge alle Ressourcen einzeln hinzu
          first=true
          for resource in $(tofu state list); do
            # Füge Komma hinzu, außer beim ersten Eintrag
            if [ "$first" = "true" ]; then
              first=false
            else
              echo "," >> terraform.tfstate.manual
            fi
            
            # Hole die Ressourcendaten und schreibe sie in die State-Datei
            tofu state show -json "$resource" >> terraform.tfstate.manual
          done
          
          # Schließe die JSON-Struktur
          echo ']}' >> terraform.tfstate.manual
          
          # Kopiere die manuelle State-Datei
          cp terraform.tfstate.manual terraform.tfstate
          
          # Status der State-Dateien anzeigen
          echo "==== State-Datei Details ===="
          ls -la terraform.tfstate*
          echo "Anzahl der Zeilen im manuellen State:"
          wc -l terraform.tfstate.manual
          echo "Inhalt der finalen State-Datei (erste 50 Zeilen):"
          cat terraform.tfstate | head -n 50
          
      - name: Configure Git
        run: |
          git config --global --add safe.directory /__w/terraform/terraform
          git config --global user.email "terraform-runner@soniiit.net"
          git config --global user.name "terraform-runner"
          
      - name: Commit state changes
        run: |
          if [ -f dns/terraform.tfstate ] && [ -s dns/terraform.tfstate ]; then
            # State-Datei ist vorhanden und nicht leer
            echo "Prüfe auf Änderungen im State..."
            echo "===== Inhalt der terraform.tfstate ====="
            cat dns/terraform.tfstate | head -n 50
            echo "===== Ende des State-Auszugs ====="
            
            git add dns/terraform.tfstate
            
            if git diff --cached --quiet dns/terraform.tfstate; then
              echo "Keine Änderungen am terraform.tfstate"
            else
              echo "Änderungen am terraform.tfstate gefunden, committe sie"
              git commit -m "[skip ci] Update DNS terraform state"
            fi
          else
            echo "Keine gültige terraform.tfstate gefunden"
            echo "Aktuelle Dateien im dns/ Verzeichnis:"
            ls -la dns/
          fi
          
      - name: Pull latest changes
        run: |
          git pull origin ${{ github.ref }} --rebase
          
      - name: Push state
        run: |
          git push origin HEAD:${{ github.ref }} 