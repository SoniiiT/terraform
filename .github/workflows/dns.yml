name: DNS Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'dns/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'dns/**'

env:
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-no-color -input=false"
  TF_CLI_ARGS_apply: "-no-color -input=false -auto-approve"

jobs:
  validate:
    name: Validate DNS Terraform
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.14.3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate
        working-directory: dns
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_tsig_key: ${{ secrets.DNS_TSIG_KEY }}
        run: |
          terraform init
          terraform validate

  plan:
    name: Plan DNS Terraform
    needs: validate
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.6.2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Plan
        working-directory: dns
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_tsig_key: ${{ secrets.DNS_TSIG_KEY }}
        run: |
          terraform init
          terraform providers lock
          terraform plan -out=tfplan
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dns
          path: dns/tfplan
          retention-days: 1

  apply:
    name: Apply DNS Terraform
    needs: plan
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.6.2
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dns
          path: dns
      
      - name: Apply
        working-directory: dns
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_tsig_key: ${{ secrets.DNS_TSIG_KEY }}
        run: |
          terraform init
          terraform apply -auto-approve tfplan 