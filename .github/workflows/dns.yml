name: DNS Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'dns/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'dns/**'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund für manuelle Ausführung'
        required: false
        default: 'Manuelle Ausführung'

env:
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-no-color -input=false"
  TF_CLI_ARGS_apply: "-no-color -input=false -auto-approve"

jobs:
  validate:
    name: Validate DNS Terraform
    runs-on: self-hosted
    container:
      image: ghcr.io/opentofu/opentofu:1.6.2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate
        working-directory: dns
        env:
          TF_VAR_tsig_key: ${{ secrets.DNS_TSIG_KEY }}
        run: |
          tofu init
          tofu validate

  plan:
    name: Plan DNS Terraform
    needs: validate
    runs-on: self-hosted
    container:
      image: ghcr.io/opentofu/opentofu:1.6.2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Plan
        working-directory: dns
        env:
          TF_VAR_tsig_key: ${{ secrets.DNS_TSIG_KEY }}
        run: |
          tofu init
          tofu providers lock
          tofu plan -out=tfplan
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dns
          path: dns/tfplan
          retention-days: 1

  apply:
    name: Apply DNS Terraform
    needs: plan
    runs-on: self-hosted
    container:
      image: ghcr.io/opentofu/opentofu:1.6.2
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dns
          path: dns
      
      - name: Apply
        working-directory: dns
        env:
          TF_VAR_tsig_key: ${{ secrets.DNS_TSIG_KEY }}
        run: |
          # Debug-Informationen zur Umgebung
          echo "Umgebungsinformationen:"
          env | grep TF_ || true
          pwd
          echo "Dateiberechtigungen:"
          ls -la ./
          
          tofu init
          tofu apply -auto-approve tfplan
          
          echo "Debug: Zeige State-Informationen"
          tofu state list
          
          # Versuche den State mit verschiedenen Methoden zu exportieren
          echo "Exportiere State mit state pull"
          tofu state pull > terraform.tfstate
          
          # Prüfe Dateiinhalt und -größe
          echo "State-Datei Größe und erste Zeilen:"
          ls -la terraform.tfstate
          cat terraform.tfstate | wc -l
          
          # Alternatives Verfahren: Jede Ressource einzeln exportieren und in eine Datei zusammenführen
          echo "Versuche alternative Methode zum State-Export"
          echo '{"version":4,"terraform_version":"1.6.2","serial":1,"lineage":"","outputs":{},"resources":[' > terraform.tfstate.full
          
          first=true
          for resource in $(tofu state list); do
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> terraform.tfstate.full
            fi
            
            # Exportiere jede Ressource einzeln
            tofu state show -json "$resource" >> terraform.tfstate.full
          done
          
          echo ']}' >> terraform.tfstate.full
          
          echo "Alternative State-Datei Größe:"
          ls -la terraform.tfstate.full
          
          # Wenn die ursprüngliche State-Datei leer ist, verwende die alternative
          if [ ! -s "terraform.tfstate" ] || [ "$(cat terraform.tfstate | wc -l)" -lt 5 ]; then
            echo "Standard State-Datei ist leer oder unvollständig, verwende alternative Version"
            cp terraform.tfstate.full terraform.tfstate
          fi
          
      - name: Configure Git
        run: |
          git config --global --add safe.directory /__w/terraform/terraform
          git config --global user.email "terraform-runner@soniiit.net"
          git config --global user.name "terraform-runner"
          
      - name: Commit state changes
        run: |
          if [ -f dns/terraform.tfstate ]; then
            if [ ! -s dns/terraform.tfstate ] || [ "$(cat dns/terraform.tfstate | wc -l)" -lt 5 ]; then
              echo "terraform.tfstate ist leer oder unvollständig, prüfe alternative Version"
              if [ -f dns/terraform.tfstate.full ] && [ -s dns/terraform.tfstate.full ]; then
                echo "Verwende vollständig exportierte State-Datei"
                cp dns/terraform.tfstate.full dns/terraform.tfstate
              fi
            fi
            
            # Debug-Ausgabe
            echo "Inhalt der finalen State-Datei:"
            cat dns/terraform.tfstate | head -20
            
            if git diff --quiet dns/terraform.tfstate; then
              echo "No changes to terraform.tfstate"
            else
              git add dns/terraform.tfstate
              git commit -m "[skip ci] Update DNS terraform state"
            fi
          else
            echo "terraform.tfstate does not exist yet"
          fi
          
      - name: Pull latest changes
        run: |
          git pull origin ${{ github.ref }} --rebase
          
      - name: Push state
        run: |
          git push origin HEAD:${{ github.ref }} 