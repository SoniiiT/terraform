name: DNS Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'dns/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'dns/**'

env:
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-no-color -input=false"
  TF_CLI_ARGS_apply: "-no-color -input=false -auto-approve"

jobs:
  validate:
    name: Validate DNS Terraform
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Fix Permissions
        run: sudo chown -R $USER:$USER .
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Validate
        working-directory: dns
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_VAR_tsig_key: ${{ secrets.BIND9_TSIG_SECRET }}
        run: |
          terraform init
          terraform validate

  plan:
    name: Plan DNS Terraform
    needs: validate
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Fix Permissions
        run: sudo chown -R $USER:$USER .
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Plan
        working-directory: dns
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_VAR_tsig_key: ${{ secrets.BIND9_TSIG_SECRET }}
        run: |
          terraform init
          terraform providers lock
          terraform plan -out=tfplan
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dns
          path: dns/tfplan
          retention-days: 1

  apply:
    name: Apply DNS Terraform
    needs: plan
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    permissions:
      coname: Fix Permissions
        run: sudo chown -R $USER:$USER .
      - ntents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dns
          path: dns
      
      - name: Apply
        working-directory: dns
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_VAR_tsig_key: ${{ secrets.BIND9_TSIG_SECRET }}
        run: |
          terraform init
          terraform apply -auto-approve tfplan 