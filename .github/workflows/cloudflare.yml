name: Cloudflare Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'cloudflare/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'cloudflare/**'

env:
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-no-color -input=false"
  TF_CLI_ARGS_apply: "-no-color -input=false -auto-approve"

jobs:
  validate:
    name: Validate Cloudflare Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: v1.17.2

      - name: Validate
        working-directory: cloudflare
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform init
          terraform validate

  plan:
    name: Plan Cloudflare Terraform
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: v1.17.2

      - name: Plan
        working-directory: cloudflare
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform init
          terraform providers lock
          terraform plan -out=tfplan
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-cloudflare
          path: cloudflare/tfplan
          retention-days: 1

  apply:
    name: Apply Cloudflare Terraform
    needs: plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: v1.17.2

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-cloudflare
          path: cloudflare
      
      - name: Apply
        working-directory: cloudflare
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform init
          terraform apply -auto-approve tfplan 