name: PVE-SRV-01 Terraform

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pve-srv-01/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'pve-srv-01/**'

env:
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-no-color -input=false"
  TF_CLI_ARGS_apply: "-no-color -input=false -auto-approve"

jobs:
  validate:
    name: Validate PVE Terraform
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Fix Permissions
        run: docker run --rm -v ${{ github.workspace }}:/work -w /work alpine chown -R $(id -u):$(id -g) .
      - uses: actions/checkout@v7
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Validate
        working-directory: pve-srv-01
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_lxc_password: ${{ secrets.PROXMOX_LXC_PASSWORD }}
        run: |
          terraform init
          terraform validate

  plan:
    name: Plan PVE Terraform
    needs: validate
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Fix Permissions
        run: docker run --rm -v ${{ github.workspace }}:/work -w /work alpine chown -R $(id -u):$(id -g) .
      - uses: actions/checkout@v7
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Plan
        working-directory: pve-srv-01
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_lxc_password: ${{ secrets.PROXMOX_LXC_PASSWORD }}
        run: |
          terraform init
          terraform providers lock
          terraform plan -out=tfplan
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-pve-srv-01
          path: pve-srv-01/tfplan
          retention-days: 1

  apply:
    name: Apply PVE Terraform
    needs: plan
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Fix Permissions
        run: docker run --rm -v ${{ github.workspace }}:/work -w /work alpine chown -R $(id -u):$(id -g) .
      - uses: actions/checkout@v7
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Download Plan Artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-pve-srv-01
          path: pve-srv-01
      
      - name: Apply
        working-directory: pve-srv-01
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_API_TOKEN }}
          TF_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          TF_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_API_TOKEN_ID }}
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_lxc_password: ${{ secrets.PROXMOX_LXC_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve tfplan 