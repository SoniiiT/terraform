name: PVE-SRV-01 Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'pve-srv-01/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'pve-srv-01/**'

env:
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-no-color -input=false"
  TF_CLI_ARGS_apply: "-no-color -input=false -auto-approve"

jobs:
  validate:
    name: Validate PVE Terraform
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.14.3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate
        working-directory: pve-srv-01
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_proxmox_api_url: "https://192.168.178.6:8006/api2/json"
          TF_VAR_proxmox_api_token_id: "terraform@pam!terraform"
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_lxc_password: ${{ secrets.LXC_PASSWORD }}
        run: |
          terraform init
          terraform validate

  plan:
    name: Plan PVE Terraform
    needs: validate
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.6.2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Plan
        working-directory: pve-srv-01
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_proxmox_api_url: "https://192.168.178.6:8006/api2/json"
          TF_VAR_proxmox_api_token_id: "terraform@pam!terraform"
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_lxc_password: ${{ secrets.LXC_PASSWORD }}
        run: |
          terraform init
          terraform providers lock
          terraform plan -out=tfplan
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-pve-srv-01
          path: pve-srv-01/tfplan
          retention-days: 1

  apply:
    name: Apply PVE Terraform
    needs: plan
    runs-on: self-hosted
    container:
      image: hashicorp/terraform:1.6.2
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-pve-srv-01
          path: pve-srv-01
      
      - name: Apply
        working-directory: pve-srv-01
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_proxmox_api_url: "https://192.168.178.6:8006/api2/json"
          TF_VAR_proxmox_api_token_id: "terraform@pam!terraform"
          TF_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_API_TOKEN_SECRET }}
          TF_VAR_lxc_password: ${{ secrets.LXC_PASSWORD }}
        run: |
          terraform init
          terraform apply -auto-approve tfplan 